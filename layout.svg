<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui,sans-serif">
<style>.k{fill:#f2f2f2;stroke:#bbb}.a{fill:#cfe8ff;stroke:#4a90d9}.w{fill:#ffe9b8;stroke:#d9a441}.c{fill:#e6e6e6;stroke:#bbb}text{text-anchor:middle;fill:#222}.s{font-size:11px;fill:#555}.l{font-size:18px;font-weight:600}</style>
