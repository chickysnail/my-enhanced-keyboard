<rect class="c" x="350" y="268" width="14" height="14" rx="3"/><text class="s" x="370" y="279" style="text-anchor:start">Ctrl+key shortcut</text>
<text class="s" x="20" y="303" style="text-anchor:start">Also: Shift selects, Alt acts as Ctrl, Ctrl acts as Alt. CapsLock+Space/Tab/Enter/Backspace/Delete` and / too.</text>
